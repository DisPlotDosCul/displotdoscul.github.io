<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Mes applis en accès libre.">
<title>Mes applis</title>
<style>
:root{--bg:#FAF8EF;--surface:#FFFFFF;--ink:#1B2433;--muted:#5B6650;--line:#DDE2CC;--accent:#1F5FBF;--hi:#F2C230}
@media (prefers-color-scheme:dark){:root{--bg:#161A14;--surface:#20261D;--ink:#F1F2E6;--muted:#B3BC9C;--line:#3A4433;--accent:#7FB2FF;--hi:#FFD95A}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:32px 16px}
h1{font-size:clamp(28px,5vw,40px);line-height:1.15;margin:0 0 18px}
.lead{color:var(--muted);margin:0 0 24px}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
a.app{display:block;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--hi);border-radius:14px;padding:16px;color:inherit;text-decoration:none}
a.app:hover,a.app:focus-visible{border-color:var(--accent);border-left-color:var(--accent)}
a.app b{display:block;font-size:18px;margin-bottom:4px}
a.app span{color:var(--muted);font-size:14px}
a.app small{display:block;margin-top:6px;color:var(--muted);font-size:12.5px}
</style>
</head>
<body>
<main>
  <h1>Mes applis</h1>
  <div class="apps">
    <a class="app" href="carnet-de-films/"><b>Ciné-club</b><span>Le carnet de films partagé entre amis.</span><small>Films consultables sans compte · compte gratuit (lien par e-mail ou Google) pour noter et échanger</small></a>
    <a class="app" href="boussole-ia/"><b>Boussole des IA</b><span>Comparer les modèles d’intelligence artificielle : top 10 par usage, consommation, rapidité, prix et formules.</span><small>Sans compte</small></a>
  </div>
</main>
</body>
</html>
