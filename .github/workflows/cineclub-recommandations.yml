name: Ciné-club — recommandations et captures
on:
  pull_request:
    paths:
      - carnet-de-films/**
      - tests/cineclub_recommandations.py
      - tests/cineclub_fixture.py
      - .github/workflows/cineclub-recommandations.yml
permissions:
  contents: read
jobs:
  recommandations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - run: python tests/cineclub_recommandations.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cineclub-recommandations-captures
          path: docs/captures/recommandations/
