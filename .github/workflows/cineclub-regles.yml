name: Ciné-club — règles Firestore (12 novembre)
on:
  pull_request:
    paths:
      - firestore.rules
      - tests/regles_firestore.mjs
      - .github/workflows/cineclub-regles.yml
permissions:
  contents: read
jobs:
  regles:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm i --no-save firebase-tools@15 @firebase/rules-unit-testing@5 firebase@12
      - run: printf '{"emulators":{"firestore":{"port":8085,"host":"127.0.0.1"},"ui":{"enabled":false}}}' > firebase.json
      - run: npx firebase emulators:exec --project demo-cineclub --only firestore "node tests/regles_firestore.mjs"
