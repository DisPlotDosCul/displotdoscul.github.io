name: Cap Logement — prix des magasins

on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 2'

permissions:
  contents: write

concurrency:
  group: logement-prix
  cancel-in-progress: false

jobs:
  prix:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Indice de prix des magasins (Open Prices)
        run: python logement/outils/prix.py logement/prix.json
      - name: Enregistrer
        run: |
          git config user.name "Cap Logement"
          git config user.email "actions@users.noreply.github.com"
          git add logement/prix.json
          git diff --cached --quiet || git commit -m "Cap Logement : prix des magasins mis à jour"
          git pull --rebase -q origin "${GITHUB_REF_NAME}" && git push
