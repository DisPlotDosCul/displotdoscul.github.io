<title>Cap Logement</title><style>:root{--bg:#EEF2F0;--surface:#F8FAF9;--ink:#1F2B29;--muted:#66746F;--line:#D3DCD8;--accent:#2F6B62;--bad:#B23A3A;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141B1A;--surface:#1B2322;--ink:#E5EEEB;--muted:#8E9C98;--line:#33403D;--accent:#86C7B8;--bad:#E57B7B;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif;display:grid;place-items:center;padding:16px}
form,.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;width:100%;max-width:340px;display:grid;gap:12px}
h1{margin:0;font:700 1.4rem system-ui,sans-serif}
input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
button{font:700 1rem system-ui,sans-serif;border:0;border-radius:8px;padding:11px;background:var(--accent);color:var(--surface);cursor:pointer}
label.r{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.9rem}label.r input{width:auto}
#err{color:var(--bad);font-weight:700;margin:0;min-height:1.2em}a{color:var(--accent)}</style></head><body>

const PWA_HEAD='<link rel="manifest" href="/logement/manifest.webmanifest"><link rel="apple-touch-icon" href="/logement/icons/icon-180.png"><link rel="icon" href="/logement/icons/icon-32.png"><meta name="theme-color" content="#2F6B62"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Cap Logement">';
let bip=null;addEventListener("beforeinstallprompt",e=>{e.preventDefault();bip=e});addEventListener("appinstalled",()=>{const b=document.getElementById("pwaB");if(b)b.remove()});

function notesUi(){if(window.top!==window||!document.body||document.getElementById("ntTab"))return;
 const K="caplog-notes",get=()=>{try{return JSON.parse(localStorage.getItem(K)||"[]")}catch(e){return []}},put=a=>{try{localStorage.setItem(K,JSON.stringify(a))}catch(e){}};
 const e=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
 document.body.insertAdjacentHTML("beforeend",'<button id="ntTab" type="button" aria-label="Noter une amélioration" title="Noter une amélioration" style="position:fixed;right:0;top:45%;z-index:100;border:0;border-radius:7px 0 0 7px;padding:9px 6px;background:#2F6B62;color:#fff;font:17px system-ui;box-shadow:0 2px 0 rgba(0,0,0,.35);cursor:pointer">✏️<span id="ntN" style="display:block;font:700 11px system-ui;margin-top:2px"></span></button>'+

 '<div style="display:flex;align-items:center;gap:8px"><b style="flex:1">✏️ Améliorations à faire</b><button type="button" id="ntX" aria-label="Fermer" style="border:0;background:none;font-size:20px;cursor:pointer;color:inherit">✕</button></div>'+

 function draw(){const a=get();document.getElementById("ntN").textContent=a.length||"";
  L.innerHTML=a.map((n,i)=>'<li><span style="color:#66746F;font-size:12px">'+e(n.p)+' · '+e(new Date(n.at).toLocaleString("fr-FR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}))+'</span> <button type="button" data-d="'+i+'" aria-label="Supprimer" style="border:0;background:none;color:#9C4A36;cursor:pointer;float:right">✕</button><br>'+e(n.t)+'</li>').join("")||'<li style="list-style:none;color:#66746F">Aucune note pour l’instant.</li>';
  L.querySelectorAll("[data-d]").forEach(b=>b.addEventListener("click",()=>{const a=get();a.splice(+b.dataset.d,1);put(a);draw()}));
  document.getElementById("ntMail").href="mailto:?subject="+encodeURIComponent("Cap Logement · améliorations à faire")+"&body="+encodeURIComponent(txt())}
