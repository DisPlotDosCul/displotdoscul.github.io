<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Cap Logement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@500;600&display=swap">
<style>
:root{--bg:#EEF2F0;--surface:#F8FAF9;--surface-2:#E7EDEA;--line:#D3DCD8;--ink:#1F2B29;--ink-2:#44524F;--muted:#66746F;--accent:#2F6B62;--accent-ink:#FFFFFF;--accent-soft:#DCEBE6;--bad:#9C4A36;
 --display:"Lexend","Avenir Next","Segoe UI",system-ui,sans-serif;--body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]):not([data-theme="soft"]){color-scheme:dark;--bg:#141B1A;--surface:#1B2322;--surface-2:#232D2B;--line:#33403D;--ink:#E5EEEB;--ink-2:#B6C4C0;--muted:#8E9C98;--accent:#86C7B8;--accent-ink:#10201C;--accent-soft:#24413B;--bad:#E39A86}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#141B1A;--surface:#1B2322;--surface-2:#232D2B;--line:#33403D;--ink:#E5EEEB;--ink-2:#B6C4C0;--muted:#8E9C98;--accent:#86C7B8;--accent-ink:#10201C;--accent-soft:#24413B;--bad:#E39A86}
:root[data-theme="soft"]{color-scheme:light;--bg:#ECE5D8;--surface:#F4EEE3;--surface-2:#E7DECF;--line:#D6CAB6;--ink:#2F2A23;--ink-2:#4F483D;--muted:#6C6354;--accent:#596B44;--accent-ink:#FFFFFF;--accent-soft:#E2E2CC}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);display:flex;flex-direction:column;min-height:100dvh}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* écran de connexion */
.gate{flex:1;display:grid;place-items:center;padding:16px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;width:100%;max-width:360px;display:grid;gap:12px}
.box h1{margin:0;font:600 1.5rem var(--display)}
.box p{margin:0;color:var(--ink-2)}
.btn{min-height:44px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:hover{border-color:var(--accent)}
input[type=email],input[type=text],input[type=password]{width:100%;min-height:44px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.msg{min-height:1.3em;font-size:15px;color:var(--ink-2)}.msg.bad{color:var(--bad);font-weight:700}
/* barre */
.bar{flex:none;display:flex;align-items:center;gap:6px;padding:6px max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px));padding-top:max(6px,env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.bar::-webkit-scrollbar{display:none}
.bar select{min-height:40px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:4px 8px;font:600 15px var(--display);cursor:pointer}
.tabs{display:flex;gap:4px;padding:3px;border-radius:12px;background:var(--surface-2)}
.tabs button{min-height:36px;padding:4px 12px;border-radius:9px;border:0;background:transparent;color:var(--ink-2);cursor:pointer;font:500 15px var(--display)}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sp{flex:1}
.ib{min-width:40px;min-height:40px;border-radius:10px;border:0;background:transparent;color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;position:relative}
.ib:hover{background:var(--surface-2)}
.badge{position:absolute;top:3px;right:3px;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:11px;line-height:16px;padding:0 4px}
@media (max-width:480px){.bar{gap:3px}.bar select{padding:4px 2px;font-size:14px}.tabs button{padding:4px 8px;font-size:14px}.ib{min-width:34px}}
iframe{flex:1;width:100%;border:0;background:var(--bg)}
/* fenêtres */
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,94vw);max-height:88dvh}
dialog::backdrop{background:rgba(0,0,0,.35)}
.dlg{padding:18px;display:grid;gap:12px}
.dlg h2{margin:0;font:600 18px var(--display);display:flex;align-items:center;gap:8px}
.dlg h2 .x{margin-left:auto}
.dlg h3{margin:6px 0 0;font:600 16px var(--display)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface-2);border-radius:12px;padding:10px 12px;display:grid;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 10px;font-size:14px}
.chip button{border:0;background:transparent;cursor:pointer;color:var(--muted);min-width:28px;min-height:28px;border-radius:50%}
.meta{font-size:13px;color:var(--muted)}
.load{flex:1;display:grid;place-items:center;color:var(--muted)}
</style>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
</head>
<body>

<div class="load" id="load">Chargement…</div>

<main class="gate" id="gate" hidden>
  <form class="box" id="login">
    <h1>Cap Logement</h1>
    <button type="button" class="btn main" id="google"><svg class="ico" viewBox="0 0 24 24"><path d="M21 12.2c0-.7-.1-1.3-.2-1.9H12v3.6h5a4.3 4.3 0 01-1.9 2.8v2.3h3A9 9 0 0021 12.2z"/><path d="M12 21a8.9 8.9 0 006.1-2.2l-3-2.3a5.5 5.5 0 01-8.2-2.9H3.8v2.4A9 9 0 0012 21z"/><path d="M6.9 13.6a5.4 5.4 0 010-3.4V7.8H3.8a9 9 0 000 8.2z"/><path d="M12 6.6c1.4 0 2.6.5 3.6 1.4l2.7-2.7A9 9 0 003.8 7.8l3.1 2.4A5.4 5.4 0 0112 6.6z"/></svg>Continuer avec Google</button>
    <div class="or">ou</div>
    <input type="email" id="email" autocomplete="email" placeholder="ton adresse e-mail" aria-label="Adresse e-mail">
    <button type="submit" class="btn">Recevoir un lien de connexion</button>
    <div class="msg" id="lmsg" role="status"></div>
  </form>
  <form class="box" id="confirm" hidden>
    <h1>Cap Logement</h1>
    <input type="email" id="email2" autocomplete="email" placeholder="ton adresse e-mail" aria-label="Adresse e-mail pour terminer la connexion">
    <button type="submit" class="btn main">Terminer la connexion</button>
    <div class="msg" id="cmsg" role="status"></div>
  </form>
  <div class="box" id="wait" hidden>
    <h1>Cap Logement</h1>
    <p id="waitTxt"></p>
    <button type="button" class="btn" id="out1">Changer de compte</button>
  </div>
</main>

<div class="bar" id="bar" hidden>
  <select id="who" aria-label="Espace" hidden></select>
  <div class="tabs" id="tabs" role="group" aria-label="Section"></div>
  <span class="sp"></span>
  <button type="button" class="ib" id="menu" title="Menu" aria-label="Menu" aria-haspopup="dialog"><svg class="ico" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg><span class="badge" id="nb" hidden></span></button>
</div>
<iframe id="view" title="Cap Logement" hidden></iframe>

<dialog id="dMenu" aria-label="Menu"><div class="dlg">
  <div class="row"><span class="meta" id="meMail" style="flex:1"></span><button type="button" class="ib" data-close aria-label="Fermer">×</button></div>
  <div class="tabs" role="group" aria-label="Affichage" id="thm"><button type="button" data-th="light">Jour</button><button type="button" data-th="soft">Doux</button><button type="button" data-th="dark">Nuit</button></div>
  <button type="button" class="btn" id="adm" hidden>Accès<span class="badge" id="nb2" hidden style="position:static"></span></button>
  <button type="button" class="btn" id="out">Se déconnecter</button>
</div></dialog>
<dialog id="dAdm" aria-labelledby="dAdm-h"><div class="dlg">
  <h2 id="dAdm-h">Accès<button type="button" class="ib x" data-close aria-label="Fermer">×</button></h2>
  <div id="dem"></div>
  <div id="spaces"></div>
  <h3>Clé de maintenance</h3>
  <div class="row"><input type="password" id="master" autocomplete="off" placeholder="clé de maintenance" aria-label="Clé de maintenance" style="flex:1;min-width:180px"><button type="button" class="btn" id="setKeys">Installer les clés</button></div>
  <div class="msg" id="amsg" role="status"></div>
</div></dialog>

<script>
(function(){
"use strict";
const ADMIN_SHA="65c788e6acf1bcd06aca88fd2ff5d057db1a7ebe900419c2daec3e35c77673a2";
// Espaces : l'identifiant sert de nom de fichier (espaces/<id>.json) et de document Firestore.
const SPACES=[{id:"licia",name:"Licia"},{id:"cloche",name:"Cloche"},{id:"violette",name:"Violette"}];
const SECTIONS={carte:"Carte",calcul:"Calcul",annonces:"Annonces",bondy:"Bondy"};
const KDF_ITER=310000;

const $=id=>document.getElementById(id);
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}return null};
const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const b64=u=>{let s="";u=new Uint8Array(u);for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}

// ---- affichage : jour, doux, nuit ----
const THEMES=["light","soft","dark"];
let th=ls("logement-theme");if(!THEMES.includes(th))th=null;
function applyTheme(){
  if(th)document.documentElement.setAttribute("data-theme",th);else document.documentElement.removeAttribute("data-theme");
  try{const de=view.contentDocument&&view.contentDocument.documentElement;if(de){th?de.setAttribute("data-theme",th):de.removeAttribute("data-theme")}}catch(e){}
}
function markTheme(){const c=th||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.querySelectorAll("#thm button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.th===c?"true":"false"))}
document.querySelectorAll("#thm button").forEach(b=>b.addEventListener("click",()=>{th=b.dataset.th;ls("logement-theme",th);applyTheme();markTheme()}));
$("menu").addEventListener("click",()=>{markTheme();$("meMail").textContent=me&&me.email||"";try{$("dMenu").showModal()}catch(e){$("dMenu").setAttribute("open","")}});
const view=$("view");
view.addEventListener("load",applyTheme);
applyTheme();

function show(which){
  $("load").hidden=which!=="load";
  $("gate").hidden=!["login","confirm","wait"].includes(which);
  $("login").hidden=which!=="login";$("confirm").hidden=which!=="confirm";$("wait").hidden=which!=="wait";
  $("bar").hidden=which!=="app";view.hidden=which!=="app";
}

if(!window.firebase||!window.CAP_FIREBASE||!CAP_FIREBASE.apiKey){
  show("wait");$("waitTxt").textContent="Le site n'est pas encore relié à sa base. Reviens un peu plus tard.";$("out1").hidden=true;return;
}
firebase.initializeApp(CAP_FIREBASE);
const auth=firebase.auth(),db=firebase.firestore();
auth.languageCode="fr";

// ---- connexion ----
const msg=(id,t,bad)=>{$(id).textContent=t||"";$(id).classList.toggle("bad",!!bad)};
$("google").addEventListener("click",()=>{
  const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});
  auth.signInWithPopup(p).catch(e=>{
    if(e&&(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment"))auth.signInWithRedirect(p);
    else if(e&&e.code!=="auth/popup-closed-by-user"&&e.code!=="auth/cancelled-popup-request")msg("lmsg","La connexion Google n'a pas abouti. Réessaie.",true);
  });
});
$("login").addEventListener("submit",e=>{e.preventDefault();
  const em=$("email").value.trim().toLowerCase();if(!em){$("email").focus();return}
  msg("lmsg","Envoi…");
  auth.sendSignInLinkToEmail(em,{url:location.origin+location.pathname,handleCodeInApp:true}).then(()=>{
    ls("capEmail",em);msg("lmsg","C'est envoyé à "+em+". Ouvre l'e-mail sur cet appareil et touche le lien. S'il n'arrive pas, regarde dans les indésirables.");
  },err=>msg("lmsg",err&&err.code==="auth/quota-exceeded"?"Trop de liens envoyés aujourd'hui : réessaie demain ou passe par Google.":"Le lien n'a pas pu partir. Vérifie l'adresse.",true));
});
function finishLink(em){
  return auth.signInWithEmailLink(em,location.href).then(()=>{ls("capEmail",null);history.replaceState(null,"",location.pathname)},
    ()=>{history.replaceState(null,"",location.pathname);show("login");msg("lmsg","Ce lien ne marche plus (déjà utilisé ou expiré). Demande-en un nouveau.",true)});
}
let linkPending=false;
if(auth.isSignInWithEmailLink(location.href)){
  const em=ls("capEmail");
  if(em)finishLink(em);else{linkPending=true;show("confirm")}
}
$("confirm").addEventListener("submit",e=>{e.preventDefault();const em=$("email2").value.trim().toLowerCase();if(!em)return;linkPending=false;msg("cmsg","Connexion…");finishLink(em)});
const signOut=()=>{ls("capSpace",null);auth.signOut().then(()=>location.reload())};
$("out").addEventListener("click",signOut);$("out1").addEventListener("click",signOut);

// ---- chiffrement ----
async function deriveKey(master,space){
  const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(master),"PBKDF2",false,["deriveBits"]);
  return crypto.subtle.deriveBits({name:"PBKDF2",salt:new TextEncoder().encode("cap-logement:"+space),iterations:KDF_ITER,hash:"SHA-256"},k0,256);
}
async function openBundle(space,rawKey){
  const r=await fetch("espaces/"+space+".json?t="+Date.now(),{cache:"no-store"});
  if(!r.ok)throw new Error("absent");
  const j=await r.json();
  const key=await crypto.subtle.importKey("raw",rawKey,{name:"AES-GCM"},false,["decrypt"]);
  const p=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(j.i)},key,unb64(j.d));
  return JSON.parse(new TextDecoder().decode(p));
}

// ---- état ----
let me=null,isAdmin=false,mine=[],bundles={},cur=null,sec=null,calcSrc=null;

auth.onAuthStateChanged(async u=>{
  if(linkPending)return;
  if(!u){show("login");return}
  show("load");
  me=u;
  const email=String(u.email||"").toLowerCase();
  isAdmin=!!(u.emailVerified&&email&&await sha(email)===ADMIN_SHA);
  // Espaces dont la clé est lisible pour ce compte (les règles Firestore décident).
  mine=[];
  for(const s of SPACES){
    try{const d=await db.doc("cles/"+s.id).get();if(d.exists&&d.data().k)mine.push(Object.assign({k:unb64(d.data().k)},s))}catch(e){}
  }
  if(isAdmin){$("adm").hidden=false;watchRequests()}
  if(!mine.length){
    if(isAdmin){openApp();openAdmin();return}
    try{await db.doc("demandes/"+u.uid).set({email,nom:u.displayName||"",at:new Date().toISOString()},{merge:true})}catch(e){}
    show("wait");$("waitTxt").textContent="Ta demande d'accès est envoyée à Licia. Rouvre cette page une fois qu'elle l'a validée.";
    return;
  }
  openApp();
});

function openApp(){
  show("app");
  const W=$("who");
  W.hidden=mine.length<2;
  W.innerHTML=mine.map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join("");
  W.onchange=()=>openSpace(W.value);
  const h=(location.hash||"").slice(1).split("-");
  const last=ls("capSpace");
  const start=mine.find(s=>s.id===h[0])||mine.find(s=>s.id===last)||mine[0];
  if(start)openSpace(start.id,h[1]);
}

async function openSpace(id,want){
  const s=mine.find(x=>x.id===id);if(!s)return;
  cur=id;ls("capSpace",id);$("who").value=id;
  if(!bundles[id]){
    try{bundles[id]=await openBundle(id,s.k)}catch(e){bundles[id]=null}
  }
  const B=bundles[id];
  if(!B){$("tabs").innerHTML="";view.removeAttribute("src");view.srcdoc='<p style="font:16px system-ui;padding:20px">Cet espace n\'a pas pu s\'ouvrir.</p>';return}
  const secs=Object.keys(B.pages||{}).filter(k=>SECTIONS[k]);
  if(B.calc)secs.splice(Math.min(1,secs.length),0,"calcul");
  const order=Object.keys(SECTIONS);secs.sort((a,b)=>order.indexOf(a)-order.indexOf(b));
  $("tabs").innerHTML=secs.map(k=>'<button type="button" data-k="'+k+'" aria-pressed="false">'+SECTIONS[k]+'</button>').join("");
  $("tabs").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>openSection(b.dataset.k)));
  openSection(secs.includes(want)?want:(secs.includes(ls("capSec-"+id))?ls("capSec-"+id):secs[0]));
}

const LINKFIX='<script>document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href]");if(!a)return;var h=a.getAttribute("href")||"";if(/^https?:/i.test(h)){a.target="_blank";a.rel="noopener"}},true)<\/script>';
function inject(html,head){
  const i=html.search(/<head[^>]*>/i);
  if(i>=0){const j=html.indexOf(">",i)+1;return html.slice(0,j)+head+html.slice(j)}
  return head+html;
}
async function openSection(k){
  sec=k;ls("capSec-"+cur,k);
  $("tabs").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===k?"true":"false"));
  try{history.replaceState(null,"","#"+cur+"-"+k)}catch(e){}
  const B=bundles[cur];let html;
  const head='<script>window.CAP_ESPACE='+JSON.stringify(cur)+';window.PROFIL='+JSON.stringify(cur)+';<\/script>';
  if(k==="calcul"){
    if(!calcSrc){const r=await fetch("calcul.html",{cache:"no-cache"});calcSrc=await r.text()}
    html=inject(calcSrc,head+'<script>window.CALC='+JSON.stringify(Object.assign({key:"vautlecout."+cur},B.calc)).replace(/</g,"\\u003c")+';<\/script>');
  }else html=inject(B.pages[k],head);
  html=html.replace(/<\/body>/i,LINKFIX+"</body>");
  view.title=SECTIONS[k];
  view.srcdoc=html;
}

// ---- accès (Licia) ----
let reqs=[],acc={};
function watchRequests(){
  db.collection("demandes").onSnapshot(q=>{reqs=q.docs.map(d=>Object.assign({uid:d.id},d.data()));const n=reqs.length;["nb","nb2"].forEach(i=>{$(i).hidden=!n;$(i).textContent=n});renderAdmin()},()=>{});
  db.collection("acces").onSnapshot(q=>{acc={};q.docs.forEach(d=>acc[d.id]=(d.data().emails||[]));renderAdmin()},()=>{});
}
function renderAdmin(){
  const opts=SPACES.map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join("");
  $("dem").innerHTML=reqs.length?'<h3>Demandes</h3>'+reqs.map(r=>'<div class="card"><b>'+esc(r.nom||r.email)+'</b><span class="meta">'+esc(r.email)+'</span><div class="row"><select data-sp="'+esc(r.uid)+'" aria-label="Espace à ouvrir">'+opts+'</select><button type="button" class="btn main" data-ok="'+esc(r.uid)+'">Ouvrir</button><button type="button" class="btn" data-no="'+esc(r.uid)+'">Refuser</button></div></div>').join(""):"";
  $("spaces").innerHTML='<h3>Qui voit quoi</h3>'+SPACES.map(s=>'<div class="card"><b>'+esc(s.name)+'</b><div class="row">'+((acc[s.id]||[]).map(e=>'<span class="chip">'+esc(e)+'<button type="button" data-rm="'+s.id+'|'+esc(e)+'" aria-label="Retirer '+esc(e)+'">×</button></span>').join("")||'<span class="meta">Toi seule</span>')+'</div><div class="row"><input type="email" data-add-in="'+s.id+'" placeholder="ajouter une adresse" aria-label="Ajouter une adresse à '+esc(s.name)+'" style="flex:1;min-width:160px"><button type="button" class="btn" data-add="'+s.id+'">Ajouter</button></div></div>').join("");
  $("dem").querySelectorAll("[data-ok]").forEach(b=>b.onclick=async()=>{const r=reqs.find(x=>x.uid===b.dataset.ok);const sp=$("dem").querySelector('[data-sp="'+CSS.escape(r.uid)+'"]').value;await addEmail(sp,r.email);await db.doc("demandes/"+r.uid).delete().catch(()=>{})});
  $("dem").querySelectorAll("[data-no]").forEach(b=>b.onclick=()=>db.doc("demandes/"+b.dataset.no).delete().catch(()=>{}));
  $("spaces").querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{const [sp,e]=b.dataset.rm.split("|");db.doc("acces/"+sp).set({emails:firebase.firestore.FieldValue.arrayRemove(e)},{merge:true}).catch(()=>msg("amsg","Pas enregistré.",true))});
  $("spaces").querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{const i=$("spaces").querySelector('[data-add-in="'+b.dataset.add+'"]');const e=i.value.trim().toLowerCase();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){i.focus();return}addEmail(b.dataset.add,e)});
}
function addEmail(sp,e){return db.doc("acces/"+sp).set({emails:firebase.firestore.FieldValue.arrayUnion(String(e).toLowerCase())},{merge:true}).then(()=>msg("amsg","Accès ouvert."),()=>msg("amsg","Pas enregistré.",true))}
function openAdmin(){renderAdmin();try{$("dAdm").showModal()}catch(e){$("dAdm").setAttribute("open","")}}
$("adm").addEventListener("click",()=>{$("dMenu").close();openAdmin()});
document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>b.closest("dialog").close()));
$("setKeys").addEventListener("click",async()=>{
  const m=$("master").value.trim();if(!m){$("master").focus();return}
  msg("amsg","Vérification…");
  try{
    const first=await deriveKey(m,SPACES[0].id);
    await openBundle(SPACES[0].id,first); // une mauvaise clé échoue ici
    for(const s of SPACES){const k=s.id===SPACES[0].id?first:await deriveKey(m,s.id);await db.doc("cles/"+s.id).set({k:b64(k)})}
    $("master").value="";msg("amsg","Clés installées.");setTimeout(()=>location.reload(),600);
  }catch(e){msg("amsg","Clé de maintenance incorrecte, ou base pas encore prête.",true)}
});
})();
</script>
