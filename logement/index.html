<style>
:root{--bg:#eef1f6;--surface:#fff;--ink:#18223a;--muted:#5b6680;--line:#d3d9e6;--accent:#2446a8;--bad:#b23a3a;color-scheme:light}

label.r{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.9rem}
label.r input{width:auto}
#err{color:var(--bad);font-weight:700;margin:0;min-height:1.2em}

const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(code){
  const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
  const p=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},k,u(D.d));
  const h=new TextDecoder().decode(p);document.open();document.write(h);document.close();
}
let saved=null;try{saved=localStorage.getItem("caplogement.code")}catch(e){}
