const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function openPage(code){
  const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);

  const h=new TextDecoder().decode(p);document.open();document.write(h);document.close();
  try{const t=localStorage.getItem("logement-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}

const st={get(k){let v=null;try{v=sessionStorage.getItem(k)}catch(e){}if(!v){try{v=localStorage.getItem(k)}catch(e){}}return v}};
function keep(code,remember){try{sessionStorage.setItem("caplogement.code",code)}catch(e){}if(remember){try{localStorage.setItem("caplogement.code",code)}catch(e){}}}
function forget(){try{localStorage.removeItem("caplogement.code");sessionStorage.removeItem("caplogement.code")}catch(e){}}
const saved=st.get("caplogement.code");

document.getElementById("f").addEventListener("submit",async e=>{e.preventDefault();
  const code=document.getElementById("c").value.trim();document.getElementById("err").textContent="";
  try{await (async()=>{keep(code,document.getElementById("m").checked);await openPage(code)})()}
